<!DOCTYPE html>
<html dir="ltr">

<head>
    <title>Zoho Charts demo</title>
    <meta charset="utf-8">
    <!-- Added d3.js  -->
    <script type="text/javascript" src="//zmstatic/mockups/mail-admin/html/cpanel/scripts/d3.min.js"></script>
    <!-- Added zc-min.js  -->
    <script type="text/javascript" src="//zmstatic/mockups/mail-admin/html/cpanel/scripts/zc.min.js"></script>

    <style type="text/css">
	body{
		margin: 0;
		padding: 0;
	}
    #container {
		height: 350px;
    	width: 100%;
    }
	#container .canvas-property{
		border: none !important;
		box-shadow: none !important;
	}
    .test {
    	display: table;
    	width: 100%;
    }
    </style>

</head>

<body style="overflow: hidden;">
    <div class="test">
        <div class="container" id="container"></div>
    </div>
    <script type="text/javascript">
    window.onload = function() {

        // This is the json data by which the chart will be drawn.

        var data = {
			"seriesdata": {
				"chartdata": [
					{
						"type": "bar",
						"data": [
							[
								[
									"Admin Users",
									5
								],
								[
									"Inactive Users",
									35
								],
								[
									"Active Users",
									65
								]
							]
						]
					}
				]
			},
			"metadata": {
				"axes": {
					"x": [
						0
					],
					"y": [
						[
							1
						]
					],
					"tooltip": [
						"<span style='font-size:14px'>{{val(0)}}</span>",
						"<span style='font-size:18px'>{{val(1)}}</span>"
					]
				},
				"columns": [
					{
						"dataindex": 0,
						"columnname": "User",
						"datatype": "ordinal",
						"columnindex": 0
					},
					{
						"dataindex": 1,
						"columnname": "Sum(Cost)",
						"datatype": "numeric",
						"numeric": {
							"format": {
								"suffix": "%"
							}
						}
					}
				]
			},
			"chart": {
				"plot": {
					"plotoptions": {
						"bar": {
							"stacked": {
								"enabled": false,
								"showAs": "percent"
							},
							"border": {
								"show": true,
								"radius": "0 6 6 0"
							},
							"outerPadding": 0,
							"levelMarker": {
								"enabled": true,
								"color": "#EDEAEA"
							},
							"datalabels": {
								"showAs": "percent",
								"show": false
							},
							"multiColoring": true,
							"maxBandWidth": 12
						}
					}
				},
				"axes": {
					"rotated": true,
					"animation": {
						"enabled": false
					},
					"xaxis": {
						"label": {
							"text": "Year(Date)",
							"show": false
						},
						"axisline": {
							"show": false
						},
						"tickmark": {
							"size": 0
						},
						"ticklabel": {
							"show": false
						},
						"maxRange": 100,
						"show": false
					},
					"yaxis": [
						{
							"label": {
								"text": "Sum(Sales)"
							},
							"ticklabel": {
								"rotation": "auto"
							},
							"show": false
						}
					]
				}
			},
			"canvas": {
				"title": {
					"show": false
				},
				"subtitle": {
					"show": false
				}
			},
			"legend": {
				"colors": [
					"#FBA23E",
					"#FD6861",
					"#317FFD"
				]
			}
		}
            // var chartObj = new $ZC.charts(container, data);  // call the function with container an

        var chartObj = new $ZC.charts(container, data);
        var form = document.forms.chart;
        form.type.onchange = function() {
        	data.seriesdata.chartdata[0].type = this.value;
        	if(this.value === "web"){
        		data = applyAxesPropForWeb(data);
        	}else{
        		data = resetAxesProp(data);
        	}
        	chartObj = new $ZC.charts(container, data);
        }
        function applyAxesPropForWeb(data){
        	data.chart = {
        		"axes":{
        			"xaxis":{
                        "grid":{
                            "color":"black",
                            "strokeWidth":0.7
                        },
                        "tickmark":{
                            "color":"black",
                            "strokeWidth":0.7
                        },
                        "axisline" : {
                            "show" : false
                        }
                    },
					"yaxis": [{
                        "ticklabel":{
                            "fontColor" : "transparent"
                        },
                        "grid":{
                            "color":"grey",
                            "strokeWidth":0.5
                        },
                        "label" : {
                            "show" : false
                        },
                        "axisline" : {
                            "show" : false
                        },
                        "tickmark":{
                            "color" : "transparent"
                        }
                    }]
        		}
        	}
        	return data;
        }
        function resetAxesProp(data){
        	data.chart = {
        		"axes":{
        			"xaxis":{},
					"yaxis": [{}]
        		}
        	}
        	return data;
        }
    }
    </script>
</body>

</html>
